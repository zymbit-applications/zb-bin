name: Build

on:
  pull_request:
    branches:
    - main

jobs:
  build:
    runs-on: ubuntu-24.04-arm

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build
      uses: actions-rs/cargo@v1
      with:
        command: build
        args: --release --target aarch64-unknown-linux-gnu
